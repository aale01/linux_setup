# Pacchetti installati tramite repo esterni (gestiti dallo script)
external:
  nodesource:
    version: "22"
    packages:
      - nodejs
      - npm

  github_cli:
    packages:
      - gh

  github_releases:
    - name: lazygit
      repo: jesseduffield/lazygit
      binary: lazygit
      asset: "lazygit_{version}_Linux_x86_64.tar.gz"

    - name: glow
      repo: charmbracelet/glow
      binary: glow
      asset: "glow_{version}_Linux_x86_64.tar.gz"

  libvirt_groups:
    - libvirt
    - kvm
