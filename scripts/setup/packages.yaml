apt:
  base_system:
    - acl
    - apt-transport-https
    - bsdutils
    - ca-certificates
    - cryptsetup
    - curl
    - dash
    - diffutils
    - dosfstools
    - efibootmgr
    - exfatprogs
    - findutils
    - gettext
    - gnupg
    - grep
    - gzip
    - hostname
    - linux-firmware
    - linux-generic
    - linux-generic-hwe-24.04
    - ntfs-3g
    - p7zip-full
    - p7zip-rar
    - rar
    - rsync
    - software-properties-common
    - unrar
    - unzip
    - zip

  development:
    - autoconf
    - automake
    - build-essential
    - clang
    - cmake
    - g++
    - gcc
    - gdb
    - make
    - meson
    - ninja-build
    - pkg-config
    - valgrind

  python:
    - python3
    - python3-pip
    - python3-venv

  shell_terminal:
    - bash-completion
    - tmux
    - zsh

  editors_git:
    - git
    - neovim
    - vim

  cli_modern:
    - bat
    - duf
    - fd-find
    - fzf
    - jq
    - ripgrep
    - tree
    - yq

  network_security:
    - dnsutils
    - nmap
    - openssh-client
    - openssh-server
    - traceroute
    - wget

  monitoring:
    - htop
    - iotop
    - lm-sensors
    - lsof
    - smartmontools
    - sysstat

  virtualization:
    - gnome-boxes
    - libvirt-clients
    - libvirt-daemon-system
    - qemu-system-x86
    - virt-manager

  multimedia:
    - ffmpeg
    - imagemagick
    - vlc

  desktop:
    - flatpak
    - gnome-tweaks
    - wl-clipboard
    
# Pacchetti installati tramite repo esterni (gestiti dallo script)
external:
  - id: nodesource
    enabled: true
    version: "22"
    packages:
      - nodejs

  - id: github-cli
    enabled: true
    packages:
      - gh

  - id: spotify
    enabled: false

npm:
  - typescript
  - nodemon

groups:
  - libvirt
  - kvm
